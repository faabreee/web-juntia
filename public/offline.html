<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Juntia</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0a0a0a; color: #fafafa; font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
      main { max-width: 360px; }
      h1 { font-size: 1.5rem; margin: 0 0 12px; }
      p { color: #a3a3a3; line-height: 1.5; }
      button { margin-top: 16px; background: #fafafa; color: #0a0a0a; border: 0; border-radius: 10px; padding: 12px 20px; font-size: 1rem; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>Para validar boletos hace falta internet: cada lectura se comprueba en el servidor para que un boleto no pueda entrar dos veces.</p>
      <p>Revisa tu conexión o cambia a otra red y vuelve a intentar.</p>
      <button onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
